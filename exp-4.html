<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    <center>
    <form>
    <h1>Hotel Room Booking Form</h1>
    <label for="name">Full Name:</label>
    <input type="text" name="name" id="name">
    <br><br>
    <label for="email">Email:</label>
    <input type="email" name="email" id="email">
    <br><br>
    <label for="Phone">Phone:</label>
    <input type="number" name="phone" id="phone">
    <br><br>
    <label for="date">check-in Date:</label>
    <input type="date" name="Check-in Date" id="date">
    <br><br>
    <label for="date">Check-out Date:</label>
    <input type="date" name="Check-out Date" id="date">
    <br><br>
    <label for="room">Room Type:</label>
    <select id="room" name="room-type">
    <option value="single">single room</option>
    <option value="double">Double room</option>
    <option value="deluxe">Deluxe room</option>
    <option value="suite">Suite room</option>
    </select>
    <br><br>
    <label for="guest count">Number of guests:</label>
    <input type="number" name="Number of guests" id="guest">
    <br><br>
    <label for="add">Special Requests:</label>
    <br>
    <textarea name="add" id="add" rows="8px" cols="40px"></textarea>
    <br><br>
    <button type="Submit">Book Now</button>
    <button type="Reset">Reset Form</button>
    </ceter>
    </fieldset>
    </form>
    </body>
    </html>
