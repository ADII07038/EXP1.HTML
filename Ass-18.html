<!DOCTYPE html>
<html>
<head>
    <title>ABC College Admission 2026</title>
    <style>
        body{
            font-family: Times New Roman, serif;
            background-color: #f5f5f5;
        }

        .container{
            width: 900px;
            margin: 15px auto;
            border: 1px solid green;
            padding: 15px;
            background-color: #fff;
        }

        .header{
            background-color: #232a84;
            color: white;
            text-align: center;
            padding: 15px;
            width: 80%;
            margin: auto;
        }

        h2{
            text-align: center;
        }

        table{
            width: 60%;
            margin: auto;
            border-collapse: collapse;
        }

        table, th, td{
            border: 1px solid #bdbdbd;
        }

        th{
            background-color: #d9d9e3;
            padding: 8px;
        }

        td{
            padding: 8px;
        }

        .form-box{
            width: 60%;
            margin: 10px auto;
            border: 1px solid gray;
            padding: 10px;
        }

        .form-box input,
        .form-box select,
        .form-box textarea{
            width: 50%;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .form-box textarea{
            width: 85%;
            height: 70px;
        }

        .footer{
            background-color: #232a84;
            color: white;
            text-align: center;
            width: 80%;
            margin: 10px auto;
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>ABC College Admission 2026</h1>
    </div>

    <h2>Courses and Fees</h2>

    <table>
        <caption>Available Courses</caption>
        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>
        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
        </tr>
        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
        </tr>
    </table>

    <div class="form-box">
        <legend>Application Form</legend>

        <label>Name:</label><br>
        <input type="text"><br>

        <label>Email:</label><br>
        <input type="email"><br>

        <label>Course:</label><br>
        <select>
            <option>B.Tech CSE</option>
            <option>BCA</option>
        </select><br>

        <label>Statement:</label><br>
        <textarea></textarea><br>

        <button type="submit">Apply</button>
    </div>

    <div class="footer">
        © 2026 ABC College
    </div>

</div>

</body>
</html>
