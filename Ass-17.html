<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eee;
        }

        .container {
            width: 450px;
            margin: 20px;
            padding: 15px 30px;
            border: 1px solid lightgreen;
            background-color: #f5f5f5;
        }

        h3 {
            color: green;
            margin-top: 0;
        }

        input {
            display: block;
            width: 180px;
            margin-bottom: 12px;
            padding: 3px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h3>Output</h3>

<div class="container">
    <form>
        <input type="text" placeholder="Full name" required>

        <input type="email" placeholder="you@college.edu" required>

        <input type="tel" placeholder="10-digit mobile" pattern="[0-9]{10}" required>

        <input type="password" placeholder="Min 6 characters" minlength="6" required>

        <input type="number" placeholder="Age (17+)" min="17" required>

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
