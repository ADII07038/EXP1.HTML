<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <form>
    <h1 align="center">Student Registration Form</h1>
    <hr>
    <label for="Name">Full name:</label>
    <input type="text"  name="name" id="name" placeholder=" Enter Your name ">
    <br><br>
    <label for="email">Email:</label> 
    <input type="email" name="email" id="email" placeholder="Enter valid email address">
    <br><br>
    <label for="pass">Password:</label>
    <input type="password" name="pass" id="pass" placeholder="Enter your password">
    <br><br>
    <label for="gender">Gender:</label>
    <input type="radio" name="gender" id="gender"><label for="gender">Male</label>
    <input type="radio" name="gender" id="gender">
    <label for="gender">Female</label>
    <input type="radio" name="gender" id="gender"><label for="gender">Other</label>
    <br><br>
    <label for="course">Course:</label>
    <select>
        <option value="option 1">--select course--</option>
        <option value="option 2">C++</option>
        <option value="option 3">HTML</option>
        <option value="option 4">Python</option>
        <option value="option 5">SQL DSA</option>
    </select>
    <br><br>
    <label for="phone">Contact No:</label>
    <input type="tel" name="phone" id="phone" placeholder="Enter Phone Number">
    <br><br>
    <label for="address">Address:</label>
    <br>
    <textarea name="address" id="add" placeholder="Enter your address" rows="5px" cols="30px"></textarea>
    <br><br>
    <button type="submit">Register</button>
    <button type="reset">Clear</button>
    <hr>
    <p style="text-align: center">&copy 2026 Student Registration Portal</p>
    </form>
    </fieldset>
    </body>
    </html>
