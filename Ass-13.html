<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weekly Timetable</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
            width: 350px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px 15px;
            text-align: center;
            font-size: 18px;
        }
        caption {
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Weekly Timetable</caption>
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>
        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2">Web Lab</td>
        </tr>
        <tr>
            <td>Tue</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>
        <tr>
            <td>Wed</td>
            <td colspan="3">Seminar</td>
        </tr>
    </table>

</body>
</html>
